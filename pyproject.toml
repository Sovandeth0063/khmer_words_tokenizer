# Package metadata and development-tool configuration for khmer-tokenizer.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khmer-tokenizer"
version = "0.1.1"
description = "Lightweight Khmer word tokenizer"
requires-python = ">=3.9"
dependencies = []
license = { file = "LICENSE" }
authors = [{ name = "Khmer Tokenizer Contributors" }]

[project.scripts]
khmer-tokenizer = "tokenizer.cli:main"

[tool.setuptools.packages.find]
include = ["tokenizer*"]

[tool.setuptools.package-data]
tokenizer = [
    "resources/*.txt",
    "resources/*.crfsuite",
    "resources/*.json",
    "py.typed",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8,<2.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
ignore = ["UP007", "UP035", "UP037", "UP045"]

[tool.mypy]
python_version = "3.9"
strict = true